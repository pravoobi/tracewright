[project]
name = "agent-testing-backend"
version = "0.1.0"
description = "AI-powered integration testing backend"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",
    "psycopg2-binary>=2.9.10",
    # Task queue
    "arq>=0.26.1",
    "redis>=5.2.0",
    # Object storage
    "minio>=7.2.11",
    # Document parsing
    "docling>=2.15.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    # LLM + observability
    "litellm>=1.57.0",
    "langfuse>=2.0.0,<3.0.0",
    "anthropic>=0.40.0",
    # Embeddings
    "sentence-transformers>=3.3.1",
    # Crypto (auth session encryption)
    "cryptography>=44.0.0",
    # Config
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # OpenTelemetry
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    # Utilities
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "rapidfuzz>=3.10.1",
    "python-magic>=0.4.27",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "reportlab>=5.0.0",
]
