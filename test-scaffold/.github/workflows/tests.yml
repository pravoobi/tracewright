name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: test-scaffold/package.json

      - name: Install dependencies
        working-directory: test-scaffold
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test-scaffold
        run: npx playwright install --with-deps chromium

      - name: Download storage state
        env:
          STORAGE_STATE_URL: ${{ secrets.STORAGE_STATE_URL }}
          STORAGE_STATE_TOKEN: ${{ secrets.STORAGE_STATE_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $STORAGE_STATE_TOKEN" \
               -o test-scaffold/fixtures/storage-state.json \
               "$STORAGE_STATE_URL"

      - name: Run Playwright tests
        working-directory: test-scaffold
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          STORAGE_STATE_PATH: fixtures/storage-state.json
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-scaffold/playwright-report/
          retention-days: 14
