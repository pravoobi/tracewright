name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: test-scaffold/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: test-scaffold
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: test-scaffold
        run: pnpm exec playwright install --with-deps chromium

      - name: Download storage state
        env:
          STORAGE_STATE_URL: ${{ secrets.STORAGE_STATE_URL }}
          STORAGE_STATE_TOKEN: ${{ secrets.STORAGE_STATE_TOKEN }}
        run: |
          mkdir -p test-scaffold/.auth
          curl -H "Authorization: Bearer $STORAGE_STATE_TOKEN" \
               -o test-scaffold/.auth/demo-app.json \
               "$STORAGE_STATE_URL"

      - name: Run Playwright tests
        working-directory: test-scaffold
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          STORAGE_STATE_PATH: .auth/demo-app.json
        run: pnpm exec playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-scaffold/playwright-report/
          retention-days: 14
